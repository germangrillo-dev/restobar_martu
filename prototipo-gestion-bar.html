const generarMenuTexto = (prods, cats) => {
  let txt = "🍕 *EL MOSTRADOR - MENÚ*\n\n";
  cats.forEach(cat => {
    const items = prods.filter(p => p.cat === cat);
    if (!items.length) return;
    txt += `*${cat.toUpperCase()}*\n`;
    items.forEach(p => { txt += `${p.ref}. ${p.nombre} ${" ".repeat(Math.max(1, 28 - p.nombre.length - String(p.ref).length))}$${Math.round(p.precio).toLocaleString("es-AR")}\n`; });
    txt += "\n";
  });
  txt += "📲 *Para pedir:* mandá los números separados por coma\n";
  txt += "Ej: *1, 2, Germán, calle Siempre Viva 123*\n";
  txt += "Para *cantidad* usá el formato *NxM* (ej: 2x1 = dos Muzzarella)\n";
  return encodeURIComponent(txt);
};

const parsearPedidoWhatsApp = (texto, prods) => {
  const datos = { cliente: "", direccion: "", telefono: "" };
  const items = [];
  const lineas = texto.split("\n").map(l => l.trim()).filter(Boolean);
  for (const l of lineas) {
    const cli = l.match(/^(?:cliente|nombre)[:\s]+(.+)/i);
    if (cli) { datos.cliente = cli[1].trim(); continue; }
    const dir = l.match(/^(?:direcci[oó]n|direccion|domicilio)[:\s]+(.+)/i);
    if (dir) { datos.direccion = dir[1].trim(); continue; }
    const tel = l.match(/^(?:tel[eé]fono|tel|telefono|celular|cel)[:\s]+(.+)/i);
    if (tel) { datos.telefono = tel[1].trim(); continue; }
  }
  // Si no hay formato "Clave: Valor", tratar como formato numérico "1, 2, nombre, calle..."
  const partes = texto.split(/[,;\n]+/).map(l => l.trim()).filter(Boolean);
  if (partes.length > 0 && !datos.cliente) {
    const partesTexto = [];
    for (const p of partes) {
      const cantNum = p.match(/^(\d+)\s*x\s*(\d{1,3})$/i);
      if (cantNum) {
        const prod = prods.find(pr => pr.ref === parseInt(cantNum[2]));
        if (prod) { items.push({ pid: prod.id, cant: parseInt(cantNum[1]), nota: "", nombre: prod.nombre, precio: prod.precio }); continue; }
      }
      const soloNum = p.match(/^(\d{1,3})$/);
      if (soloNum) {
        const prod = prods.find(pr => pr.ref === parseInt(soloNum[1]));
        if (prod) { items.push({ pid: prod.id, cant: 1, nota: "", nombre: prod.nombre, precio: prod.precio }); continue; }
      }
      const notaMatch = p.match(/^(.+?)\((.+?)\)$/);
      const sinNota = notaMatch ? notaMatch[1].trim() : p;
      const nota = notaMatch ? notaMatch[2].trim() : "";
      let cant = 1, nombre = sinNota;
      const m1 = sinNota.match(/^(\d+)\s*x\s*(.+)/i) || sinNota.match(/^(\d+)\s+(.+)/);
      if (m1) { cant = parseInt(m1[1]); nombre = m1[2].trim(); }
      else { const m2 = sinNota.match(/^(.+?)\s*x\s*(\d+)$/i); if (m2) { cant = parseInt(m2[2]); nombre = m2[1].trim(); } }
      const nlow = nombre.toLowerCase();
      const prod = prods.find(p => p.nombre.toLowerCase() === nlow || nlow.includes(p.nombre.toLowerCase()) || p.nombre.toLowerCase().includes(nlow));
      if (prod) { items.push({ pid: prod.id, cant, nota, nombre: prod.nombre, precio: prod.precio }); continue; }
      partesTexto.push(p);
    }
    if (partesTexto.length >= 2) {
      datos.cliente = partesTexto.slice(0, -1).join(", ");
      datos.direccion = partesTexto[partesTexto.length - 1];
    } else if (partesTexto.length === 1) {
      datos.cliente = partesTexto[0];
    }
  } else if (!datos.cliente && items.length === 0) {
    for (const l of lineas) {
      if (/^(?:cliente|nombre|direcci[oó]n|tel)/i.test(l)) continue;
      const notaMatch = l.match(/^(.+?)\((.+?)\)$/);
      const sinNota = notaMatch ? notaMatch[1].trim() : l;
      const nota = notaMatch ? notaMatch[2].trim() : "";
      let cant = 1, nombre = sinNota;
      const m1 = sinNota.match(/^(\d+)\s*x\s*(.+)/i) || sinNota.match(/^(\d+)\s+(.+)/);
      if (m1) { cant = parseInt(m1[1]); nombre = m1[2].trim(); }
      else { const m2 = sinNota.match(/^(.+?)\s*x\s*(\d+)$/i); if (m2) { cant = parseInt(m2[2]); nombre = m2[1].trim(); } }
      const nlow = nombre.toLowerCase();
      const prod = prods.find(p => p.nombre.toLowerCase() === nlow || nlow.includes(p.nombre.toLowerCase()) || p.nombre.toLowerCase().includes(nlow));
      if (prod) items.push({ pid: prod.id, cant, nota, nombre: prod.nombre, precio: prod.precio });
    }
  }
  return { datos, items };
};

    setFacturas((fs) => [{ id: uid(), proveedor: provSel.nombre, tipo: fac.tipo, numero: fac.numero, fecha: fac.fecha, total: tot.total, items: validos.map((it) => { const c = calcItem(it); return { desc: c.a.desc, bulto: c.a.bulto, cantidad: c.cantB, ingreso: c.ingreso, insumoUn: unidadDe(c.a.insumo) }; }) }, ...fs]);

                  {caja.cierre > 0 && <div className="rounded-lg p-3 text-center mt-2" style={{ background: C.base }}><span style={{ fontSize: 13, color: C.muted }}>Diferencia: </span><span style={{ fontWeight: 800, fontSize: 18, color: (caja.cierre - cajaEsperado) >= 0 ? C.green : C.red }}>{dinero(caja.cierre - cajaEsperado)}</span></div>}

                    if (caja.cierre === null || caja.cierre <= 0) { setToast({ tipo: "error", texto: "Ingresá el monto de cierre primero." }); return; }
                    const pendientes = deliveries.filter(d => d.estado !== "entregado");
                    const mesasAbiertas = Object.entries(mesas).filter(([, m]) => m.lineas.length || m.enviado.length);
                    if (pendientes.length || mesasAbiertas.length) {

                    }
                    const diff = caja.cierre - cajaEsperado;
                    const cierreCompleto = { ...caja, diff, fechaCierre: hoy() + " " + hora() };
                    setHistorialCierres((h) => [cierreCompleto, ...h]);
                    const cajaLimpia = { fecha: hoy(), apertura: 0, movimientos: [], cierre: null, saldoFinal: null, turno: "", usuario: "", arqueo: {} };
                    setCaja(cajaLimpia);
                    try { localStorage.setItem("elmo_caja", JSON.stringify(cajaLimpia)); } catch {}
                    setCajaIniciada(false);
                    setDeliveries((d) => d.filter(x => x.estado === "entregado"));
                    setMesas((ms) => Object.fromEntries(MESAS.map((m) => [m.id, { lineas: [], enviado: [], despachado: [], bebidas: [] }])));
                    setShowCierreModal(false);
                    setToast({ tipo: "ok", texto: "Caja cerrada. Diferencia: " + dinero(diff) + ". Pedidos pendientes limpiados." });
                  }} className="flex items-center justify-center gap-2 py-3 rounded-lg font-bold mt-4" style={{ background: C.amber, color: "#241a0c" }}><CheckCircle2 size={16} /> Confirmar cierre</button>

                      const egresos = (hc.movimientos || []).filter(m => m.tipo === "egreso").reduce((a, m) => a + m.monto, 0);

                          <span>Egresos: <span style={{ color: C.red }}>{dinero(egresos)}</span></span>
                          <span>Esperado: {dinero(esperado)}</span>
                          <span>Cierre: {dinero(hc.cierre || 0)}</span>
                          <span style={{ fontWeight: 700 }}>Diferencia: <span style={{ color: (hc.diff || 0) >= 0 ? C.green : C.red }}>{dinero(hc.diff || 0)}</span></span>

                          <div key={j} style={{ fontSize: 12, color: C.muted }}>{m.hora} · {m.concepto} · {m.tipo === "venta" ? "+" : "-"}{dinero(m.monto)}</div>

                      </div>;

                <div><label style={lbl}>Receta (ingredientes)</label><div className="flex flex-col gap-2">{abmProd.receta.map((r) => (<div key={r.rid} className="flex items-center gap-2"><select style={{ ...miniInput, flex: 1 }} value={r.insumoId} onChange={(e) => setIng(r.rid, "insumoId", e.target.value)}><option value="">Insumo…</option>{insumos.map((i) => <option key={i.id} value={i.id}>{i.nombre}</option>)}</select><input style={{ ...miniInput, width: 70 }} type="number" placeholder="cant" value={r.cantidad} onChange={(e) => setIng(r.rid, "cantidad", e.target.value)} /><span style={{ width: 22, color: C.muted, fontSize: 12 }}>{r.insumoId ? unidadDe(r.insumoId) : ""}</span><button onClick={() => delIng(r.rid)} className="w-7 h-7 rounded-md flex items-center justify-center flex-shrink-0" style={{ background: C.base, color: C.muted }}><X size={14} /></button></div>))}</div><button onClick={addIng} className="flex items-center gap-1 mt-2 px-3 py-1.5 rounded-lg text-xs font-semibold" style={{ background: C.base, border: "1px dashed " + C.border, color: C.amber }}><Plus size={14} /> Agregar ingrediente</button></div>

            </div>

            <div className="flex items-center justify-between mb-4">

                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: met === "Efectivo" ? C.green : C.amber }} />

              </div>

      {/* Modal forma de pago delivery */}
      {showPagoDelivery && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.6)" }} onClick={() => setShowPagoDelivery(null)}>
          <div className="w-full max-w-sm rounded-xl p-5" style={{ background: C.raised2, border: "1px solid " + C.border }} onClick={(e) => e.stopPropagation()}>

      {whatsappModal === "recibir" && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.6)" }} onClick={() => setWhatsappModal(null)}>
          <div className="w-full max-w-lg rounded-xl p-5" style={{ background: C.raised2, border: "1px solid " + C.border, maxHeight: "90vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3"><h3 style={{ fontWeight: 800, fontSize: 18 }}>Recibir pedido por WhatsApp</h3><button onClick={() => setWhatsappModal(null)} style={{ color: C.muted }}><X size={18} /></button></div>
            <p style={{ color: C.muted, fontSize: 13, marginBottom: 10 }}>Pegá acá el mensaje de WhatsApp. Reconozco formato numérico (ej: "1, 2, nombre, calle...") o por nombres (ej: "2x Muzzarella").</p>
            <textarea style={{ ...inputStyle, minHeight: 180, resize: "vertical", fontFamily: "monospace", fontSize: 13 }} value={pedidoRaw} onChange={(e) => setPedidoRaw(e.target.value)} placeholder={"1, 2, Germán, calle Siempre Viva 123 — o — Cliente: Juan Perez — Direccion: Av Siempre Viva 123 — Tel: 11-5555-5555 — 2x Muzzarella (sin cebolla) — 1x Napolitana"} />
            <div className="flex gap-2 mt-3">
              <button onClick={() => { const res = parsearPedidoWhatsApp(pedidoRaw, productos); if (!res.datos.cliente) { setToast({ tipo: "error", texto: "No encontré nombre del cliente. Escribí \"Cliente: ...\" en el mensaje." }); return; } if (!res.items.length) { setToast({ tipo: "error", texto: "No pude identificar productos. Revisá que los nombres coincidan con la carta." }); return; } setOrden({ tipo: "delivery", mesaId: null, lineas: res.items.map(l => ({ lid: uid(), ...l })), datos: res.datos }); setCat("Pizzas"); setVista("orden"); setWhatsappModal(null); setToast({ tipo: "ok", texto: "Pedido parseado: " + res.items.length + " producto(s) de " + res.datos.cliente + ". Revisá y enviá a cocina." }); }} className="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg font-bold" style={{ background: C.amber, color: "#241a0c" }}><Smartphone size={16} /> Parsear y cargar pedido</button>
              <button onClick={() => setWhatsappModal(null)} className="px-4 rounded-lg" style={{ background: C.base, color: C.muted, border: "1px solid " + C.border }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* WhatsApp config número */}
      {whatsappModal === "config" && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.6)" }} onClick={() => setWhatsappModal(null)}>
          <div className="w-full max-w-sm rounded-xl p-5" style={{ background: C.raised2, border: "1px solid " + C.border }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4"><h3 style={{ fontWeight: 800, fontSize: 18 }}>Número de WhatsApp</h3><button onClick={() => setWhatsappModal(null)} style={{ color: C.muted }}><X size={18} /></button></div>
            <p style={{ color: C.muted, fontSize: 13, marginBottom: 10 }}>Ingresá el número del bar (con código de país y sin +). Ej: 5491155551234</p>
            <input style={inputStyle} value={pedidoRaw} onChange={(e) => setPedidoRaw(e.target.value)} placeholder="5491155551234" />
            <div className="flex gap-2 mt-3">
              <button onClick={() => { WA_NUMERO = pedidoRaw; localStorage.setItem("elmo_wa_numero", pedidoRaw); setWhatsappModal(null); setToast({ tipo: "ok", texto: "Número actualizado. Compartí el menú para probar." }); }} className="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg font-bold" style={{ background: C.amber, color: "#241a0c" }}><CheckCircle2 size={16} /> Guardar</button>
              <button onClick={() => setWhatsappModal(null)} className="px-4 rounded-lg" style={{ background: C.base, color: C.muted, border: "1px solid " + C.border }}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

       {/* QR por mesa */}
      {qrMesa !== null && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.6)" }} onClick={() => setQrMesa(null)}>
          <div className="w-full max-w-sm rounded-xl p-5 text-center" style={{ background: C.raised2, border: "1px solid " + C.border }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3"><h3 style={{ fontWeight: 800, fontSize: 18 }}>Mesa {qrMesa}</h3><button onClick={() => setQrMesa(null)} style={{ color: C.muted }}><X size={18} /></button></div>
            <div>
              <p style={{ color: C.muted, fontSize: 11, marginBottom: 8 }}>📱 Escaneá para pedir</p>
              <img id={"qr-img-" + qrMesa} src={"https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(publicUrl + "/menu-mesa.html?mesa=" + qrMesa)} alt={"QR Web Mesa " + qrMesa} style={{ width: 200, height: 200, margin: "0 auto", borderRadius: 12, background: "#fff", padding: 6 }} />
              <p style={{ color: "#a89a8c", fontSize: 10, marginTop: 6, wordBreak: "break-all" }}>{publicUrl}/menu-mesa.html?mesa={qrMesa}</p>
            </div>
            <div className="flex gap-2 mt-4">
              <button onClick={() => { window.open("https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(publicUrl + "/menu-mesa.html?mesa=" + qrMesa), "_blank"); }} className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-semibold" style={{ background: C.base, border: "1px solid " + C.border, color: C.text }}><Printer size={15} /> Descargar QR</button>
              <button onClick={() => setQrMesa(null)} className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-semibold" style={{ background: C.base, border: "1px solid " + C.border, color: C.text }}>Cerrar</button>
            </div>
          </div>
        </div>
      )}

      {showWaPopup && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.6)" }} onClick={() => setShowWaPopup(false)}>
          <div className="w-full max-w-md rounded-xl p-5" style={{ background: C.raised2, border: "1px solid " + C.border, maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3"><h3 style={{ fontWeight: 800, fontSize: 18 }}><Smartphone size={16} style={{ marginRight: 6 }} />Pedidos WhatsApp</h3><button onClick={() => setShowWaPopup(false)} style={{ color: C.muted }}><X size={18} /></button></div>
            {waPedidos.length === 0 ? (
              <p style={{ color: C.muted, fontSize: 14 }}>No hay pedidos pendientes.</p>
            ) : (
              <div className="flex flex-col gap-3">{waPedidos.map((wp) => (
                <div key={wp.id} className="rounded-xl p-4" style={{ background: C.raised, border: "1px solid " + C.border }}>
                  <div className="flex items-start justify-between gap-2">
                    <div><div style={{ fontWeight: 700, fontSize: 15 }}>{wp.mesa ? "Mesa " + wp.mesa : (wp.nombre || "Cliente")}</div>{wp.mesa ? "" : (wp.direccion ? <div style={{ color: C.muted, fontSize: 13 }}>{wp.direccion}</div> : "")}{wp.telefono ? <div style={{ color: C.muted, fontSize: 12 }}>{wp.telefono}</div> : ""}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{wp.hora}</div>
                  </div>
                  <div className="flex flex-col gap-1 mt-2" style={{ fontSize: 13 }}>{wp.items.map((it, k) => (<div key={k}>{it.cant}x {it.nombre}{it.nota ? <span style={{ color: C.muted, fontStyle: "italic" }}> ({it.nota})</span> : ""}</div>))}</div>
                  {!esVisor && <div className="flex gap-2 mt-3">
                    <button onClick={() => { const items = wp.items.map(it => { const porRef = it.ref && Object.values(prodById).find(p => p.ref === it.ref); const porNombre = Object.values(prodById).find(p => p.nombre === it.nombre); const pid = porRef?.id || porNombre?.id || ""; return { lid: uid(), pid, cant: it.cant, nota: it.nota || "" }; }); const prodsOk = items.filter(l => l.pid).length; if (prodsOk === 0) { setToast({ tipo: "error", texto: "No se pudieron identificar los productos del pedido." }); return; } importarWAPedido(wp, items); setShowWaPopup(false); }} className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-semibold text-sm" style={{ background: C.amber, color: "#241a0c" }}><Send size={15} /> Importar</button>
                    <button onClick={() => { fetch(serverUrl + "/api/pedidos/" + wp.id + "/enviado", { method: "POST" }).then(() => setWaPedidos((ps) => ps.filter(p => p.id !== wp.id))); }} className="px-3 rounded-lg text-sm" style={{ background: C.base, border: "1px solid " + C.border, color: C.muted }}>Ignorar</button>
                  </div>}
                </div>
              ))}</div>
            )}
          </div>
        </div>
      )}

      {/* Cocina popup */}
      {showCocinaPopup && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.6)" }} onClick={() => setShowCocinaPopup(false)}>
          <div className="w-full max-w-lg rounded-xl p-5" style={{ background: C.raised2, border: "1px solid " + C.border, maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3"><h3 style={{ fontWeight: 800, fontSize: 18 }}><Flame size={16} style={{ marginRight: 6 }} />Cocina</h3><button onClick={() => setShowCocinaPopup(false)} style={{ color: C.muted }}><X size={18} /></button></div>
            {(() => {
              const enCocina = [];
              const despachados = [];
              for (const m of MESAS) {
                if (mesas[m.id].enviado.length > 0) enCocina.push({ tipo: "mesa", id: m.id, label: "Mesa " + m.id, items: mesas[m.id].enviado, total: sumLin(mesas[m.id].enviado) });
                if ((mesas[m.id].despachado || []).length > 0) despachados.push({ tipo: "mesa", id: m.id, label: "Mesa " + m.id, items: mesas[m.id].despachado, total: sumLin(mesas[m.id].despachado) });
              }
              for (const d of deliveries) {
                if (d.estado === "cocina") enCocina.push({ tipo: "delivery", id: d.id, label: d.cliente, direccion: d.direccion, items: d.items, total: d.total, hora: d.hora, telefono: d.telefono });
                if (d.estado === "despachado") despachados.push({ tipo: "delivery", id: d.id, label: d.cliente, direccion: d.direccion, items: d.items, total: d.total, hora: d.hora, telefono: d.telefono });
              }
              return (
                <div className="flex flex-col gap-4">
                  {enCocina.length === 0 && despachados.length === 0 ? (
                    <p style={{ color: C.muted, fontSize: 14 }}>No hay pedidos en cocina.</p>
                  ) : (
                    <>
                      {enCocina.length > 0 && (
                        <div>
                          <h4 style={{ fontWeight: 700, fontSize: 14, color: C.amber, marginBottom: 8 }}>En cocina ({enCocina.length})</h4>
                          <div className="flex flex-col gap-2">{enCocina.map((oc) => (
                            <div key={oc.tipo + oc.id} className="rounded-xl p-3" style={{ background: C.raised, border: "1px solid " + C.amber }}>
                              <div className="flex items-start justify-between gap-2">
                                <div style={{ fontWeight: 700, fontSize: 14 }}>{oc.tipo === "mesa" ? <Users size={14} style={{ marginRight: 4 }} /> : <Bike size={14} style={{ marginRight: 4 }} />}{oc.label}</div>
                                <div style={{ textAlign: "right" }}><div style={{ color: C.amber, fontWeight: 800, fontSize: 14 }}>{pesos(oc.total)}</div>{oc.tipo === "delivery" && <div style={{ color: C.muted, fontSize: 11 }}>{oc.direccion}</div>}<div style={{ color: C.muted, fontSize: 10 }}>{oc.hora}</div></div>
                              </div>
                              <div className="flex flex-col gap-0.5 mt-1" style={{ fontSize: 12, color: C.muted }}>{oc.items.map((it, k) => (
                                <div key={k}>{it.cant}x {prodById[it.pid]?.nombre || it.nombre}{it.nota ? <span style={{ fontStyle: "italic" }}> ({it.nota})</span> : ""}</div>
                              ))}</div>
                              {!esVisor && <div className="flex gap-2 mt-2"><button onClick={() => { if (oc.tipo === "mesa") despacharMesa(oc.id); else { entregarDelivery(oc.id); if (oc.telefono) abrirWA(oc.telefono, "¡Hola " + oc.label + "! Tu pedido de " + pesos(oc.total) + " fue despachado. ¡Gracias por tu compra!"); } setShowCocinaPopup(true); }} className="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg font-semibold text-sm" style={{ background: C.amber, color: "#241a0c" }}>Despachar</button></div>}
                            </div>
                          ))}</div>
                        </div>
                      )}
                      {despachados.length > 0 && (
                        <div>
                          <h4 style={{ fontWeight: 700, fontSize: 14, color: C.green, marginBottom: 8 }}>Despachados ({despachados.length})</h4>
                          <div className="flex flex-col gap-2">{despachados.map((oc) => (
                            <div key={oc.tipo + "-d-" + oc.id} className="rounded-xl p-3" style={{ background: C.raised, border: "1px solid " + C.green, opacity: 0.85 }}>
                              <div className="flex items-start justify-between gap-2">
                                <div style={{ fontWeight: 700, fontSize: 14, color: C.muted }}>{oc.tipo === "mesa" ? <Users size={14} style={{ marginRight: 4 }} /> : <Bike size={14} style={{ marginRight: 4 }} />}{oc.label}</div>
                                <div style={{ textAlign: "right" }}><div style={{ color: C.amber, fontWeight: 800, fontSize: 14 }}>{pesos(oc.total)}</div>{oc.tipo === "delivery" && <div style={{ color: C.muted, fontSize: 11 }}>{oc.direccion}</div>}<div style={{ color: C.muted, fontSize: 10 }}>{oc.hora}</div></div>
                              </div>
                              <div className="flex flex-col gap-0.5 mt-1" style={{ fontSize: 12, color: C.muted }}>{oc.items.map((it, k) => (
                                <div key={k}>{it.cant}x {prodById[it.pid]?.nombre || it.nombre}{it.nota ? <span style={{ fontStyle: "italic" }}> ({it.nota})</span> : ""}</div>
                              ))}</div>
                              {!esVisor && oc.tipo === "delivery" && (
                                <button onClick={() => { setShowCocinaPopup(false); setShowPagoDelivery({ id: oc.id, cliente: oc.label, total: oc.total, telefono: oc.telefono }); }} className="w-full flex items-center justify-center gap-2 py-2 rounded-lg font-semibold text-sm mt-2" style={{ background: C.green, color: "#fff" }}>Marcar entregado</button>
                              )}
                            </div>
                          ))}</div>
                        </div>
                      )}
                    </>
                  )}
                </div>
              );
            })()}
          </div>
        </div>
      )}

      {/* Egreso modal */}
      {showEgresoModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.6)" }} onMouseDown={() => setShowEgresoModal(false)}>
          <div className="w-full max-w-sm rounded-xl p-5" style={{ background: C.raised2, border: "1px solid " + C.border }} onMouseDown={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4"><h3 style={{ fontWeight: 800, fontSize: 18 }}>{editEgresoId ? "Editar egreso" : "Nuevo egreso"}</h3><button onClick={() => setShowEgresoModal(false)} style={{ color: C.muted }}><X size={18} /></button></div>
            <div className="flex flex-col gap-3">
              <div><label style={lbl}>Concepto</label><input style={inputStyle} placeholder="Ej: Pan, verduras..." value={egresoConcepto} onChange={(e) => setEgresoConcepto(e.target.value)} autoFocus /></div>
              <div><label style={lbl}>Monto ($)</label><input style={inputStyle} type="number" min="0" placeholder="0" value={egresoMonto} onChange={(e) => setEgresoMonto(e.target.value)} /></div>
              <button onClick={() => {
                const concepto = egresoConcepto.trim();
                const monto = parseFloat(egresoMonto);
                if (!concepto) { setToast({ tipo: "error", texto: "Falta el concepto." }); return; }
                if (!monto || monto <= 0) { setToast({ tipo: "error", texto: "Monto inválido." }); return; }
                setCaja((c) => {
                  if (editEgresoId) {
                    return { ...c, movimientos: c.movimientos.map(m => m.id === editEgresoId ? { ...m, concepto, monto } : m) };
                  }
                  return { ...c, movimientos: [...c.movimientos, { id: uid(), tipo: "egreso", concepto, monto, metodo: "Efectivo", hora: hora(), usuario: usuario.nombre }] };
                });
                setShowEgresoModal(false);
                setToast({ tipo: "ok", texto: editEgresoId ? "Egreso actualizado." : "Egreso registrado: $" + monto.toLocaleString("es-AR") });
              }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg font-semibold mt-1" style={{ background: C.red, color: "#fff" }}><span>{editEgresoId ? "Guardar cambios" : "Registrar egreso"}</span></button>
            </div>
          </div>
        </div>
      )}

      {showConfig && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.6)" }} onClick={() => setShowConfig(false)}>
          <div className="w-full max-w-md rounded-xl p-5" style={{ background: C.raised2, border: "1px solid " + C.border, maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h3 style={{ fontWeight: 800, fontSize: 18 }}><Settings size={16} style={{ marginRight: 6 }} />Configuraciones</h3>
              <button onClick={() => setShowConfig(false)} style={{ color: C.muted }}><X size={18} /></button>
            </div>
            <div className="flex flex-col gap-4">
              <div>
                <label style={{ color: C.muted, fontSize: 11, marginBottom: 3, display: "block", fontWeight: 600 }}>Destino de impresión — Comandas (cocina)</label>
                <select value={config.destinoComanda} onChange={(e) => setConfig((c) => ({ ...c, destinoComanda: e.target.value }))} style={inputStyle}>
                  <option value="default">Impresora predeterminada</option>
                  <option value="cocina1">Cocina 1</option>
                  <option value="cocina2">Cocina 2</option>
                  <option value="bar">Bar / Bebidas</option>
                  <option value="salon">Salón</option>
                  <option value="ninguna">No imprimir</option>
                </select>
              </div>
              <div>
                <label style={{ color: C.muted, fontSize: 11, marginBottom: 3, display: "block", fontWeight: 600 }}>Destino de impresión — Facturación</label>
                <select value={config.destinoFacturacion} onChange={(e) => setConfig((c) => ({ ...c, destinoFacturacion: e.target.value }))} style={inputStyle}>
                  <option value="default">Impresora predeterminada</option>
                  <option value="caja1">Caja 1</option>
                  <option value="caja2">Caja 2</option>
                  <option value="facturacion">Facturación</option>
                  <option value="ninguna">No imprimir</option>
                </select>
              </div>
              <div className="flex items-center justify-between py-2 px-3 rounded-lg" style={{ background: C.base, border: "1px solid " + C.border }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>Enviar bebidas a comandera</div>
                  <div style={{ fontSize: 11, color: C.muted }}>Si está activo, las bebidas también se envían a cocina al presionar "Enviar"</div>
                </div>
                <button onClick={() => setConfig((c) => ({ ...c, enviarBebidas: !c.enviarBebidas }))} className="relative w-11 h-6 rounded-full transition-colors" style={{ background: config.enviarBebidas ? C.amber : C.border }}>
                  <div className="absolute top-0.5 w-5 h-5 rounded-full transition-transform" style={{ background: "#fff", left: config.enviarBebidas ? 22 : 2 }} />
                </button>
              </div>
              <div>
                <label style={{ color: C.muted, fontSize: 11, marginBottom: 3, display: "block", fontWeight: 600 }}>Nombre del destino personalizado</label>
                <div className="flex gap-2">
                  <input value={(config.nombresDestinos || {}).personal || ""} onChange={(e) => setConfig((c) => ({ ...c, nombresDestinos: { ...(c.nombresDestinos || {}), personal: e.target.value } }))} placeholder="Ej: Cocina 3, Terraza..." style={{ ...inputStyle, flex: 1 }} />
                  <select value={(config.nombresDestinos || {}).personalTipo || "cocina"} onChange={(e) => setConfig((c) => ({ ...c, nombresDestinos: { ...(c.nombresDestinos || {}), personalTipo: e.target.value } }))} style={{ ...inputStyle, width: 120 }}>
                    <option value="cocina">Cocina</option>
                    <option value="facturacion">Facturación</option>
                    <option value="bar">Bar</option>
                  </select>
                </div>
              </div>
              <div className="flex items-start gap-2 mt-1 px-3 py-2 rounded-lg" style={{ background: C.base, border: "1px solid " + C.border }}>
                <AlertTriangle size={14} style={{ color: C.amber, flexShrink: 0, marginTop: 2 }} />
                <span style={{ fontSize: 12, color: C.muted }}>Los destinos se usan para identificar la impresora en el navegador. Configuralas desde la impresora del sistema.</span>
              </div>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed left-1/2 bottom-6 -translate-x-1/2 px-4 py-3 rounded-xl flex items-center gap-2 max-w-md z-50" style={{ background: toast.tipo === "ok" ? C.raised2 : "#3a201c", border: "1px solid " + (toast.tipo === "ok" ? C.green : C.red), boxShadow: "0 8px 30px rgba(0,0,0,.5)" }}>
          {toast.tipo === "ok" ? <CheckCircle2 size={18} style={{ color: C.green, flexShrink: 0 }} /> : <AlertTriangle size={18} style={{ color: C.red, flexShrink: 0 }} />}
          <span style={{ fontSize: 13 }}>{toast.texto}</span><button onClick={() => setToast(null)} style={{ color: C.muted }}><X size={15} /></button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
